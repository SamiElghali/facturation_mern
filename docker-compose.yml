version: '3.8'

services:
  mongodb:
    image: mongo
    container_name: mongo_db
    ports:
      - 27017:27017
    volumes:
      - mongo:/data
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    networks:
      - mern-network

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    restart: always
    ports:
      - 8080:8080
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=root
      - ME_CONFIG_MONGODB_SERVER=mongodb
      
    networks:
      - mern-network

  backend:
    build:
      context: ./backend  # Path to the backend code
    container_name: backend
    ports:
      - "3000:3000"
    networks:
      - mern-network
    environment:
      - DATABASE_URL=mongodb://root:root@mongodb:27017

  frontend:
    build:
      context: ./frontend  # Path to the frontend code
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  mongo: {}
